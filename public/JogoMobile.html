<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('./fonts/Minecraftia.ttf') format('truetype');
        }

        body {
            align-items: center;
            text-align: center;

            transition: filter 0.3s ease;
        }

        #caixa {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;

            align-items: center;
            justify-content: center;
        }

        #screen {
            border: solid 10px gray;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;

            width: 90%;
            height: 400px;
        }

        #jogadores {
            display: flex;
            flex-direction: column;
            align-items: center;

            border: solid 1px rgb(221, 191, 159);
            border-radius: 4px;
            margin: 7px;
            font-family: 'Minecraft', sans-serif;

            width: 100%;
            max-width: 400px;
            background-color: bisque;
        }

        #playerDiv {
            font-size: 100%;
            font-family: 'Minecraft', sans-serif;
        }

        h1 {
            position: fixed;
        }

        button {
            width: 55px;
            height: 55px;
            margin: 8px 0;

            border: none;
            border-radius: 12px;

            font-size: 18px;
            font-weight: 600;

            color: #fff;
            background: linear-gradient(135deg, #4a6cff, #6a8dff);

            cursor: pointer;

            /* Sombra moderna */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);

            transition: all 0.2s ease;
        }

        button:active {
            scale: 1.1;
        }
    </style>
</head>

<body>
    <div id="caixa">
        <canvas id="screen" width="21" height="21"></canvas>
        <div id='button-mob'>
            <button type="button" id="up">^</button>
            <div>
                <button type="button" id="left"><</button>
                <button type="button" id="down">v</button>
                <button type="button" id="right">></button>
            </div>

        </div>
    </div>
    <h1 id="h1">|---</h1>

    <script type="module">
        import io from "https://cdn.socket.io/4.8.1/socket.io.esm.min.js"

        import createKeybordListenes from './KeybordListenes.js'
        import CreateGame from './game.js'
        import renderScreen from './render-screen.js'
        import SetPlayer from './setplayer.js'

        const socket = io()
        const screen = document.getElementById("screen");
        const game = CreateGame()
        const playersBox = document.getElementById('jogadores')
        const h1 = document.getElementById("h1")

        let state = game.state
        let playersConectados = 0

        const localPlayer = localStorage.getItem("playerId")
        let playerId = null
        const playersDeath = {
            players: {}
        }

        document.getElementById("up").addEventListener("click", () => {
            move("ArrowUp")
        })

        document.getElementById("down").addEventListener("click", () => {
            move("ArrowDown")
        })

        document.getElementById("left").addEventListener("click", () => {
            move("ArrowLeft")
        })

        document.getElementById("right").addEventListener("click", () => {
            move("ArrowRight")
        })

        function move(key) {
            if (key === 'ArrowUp') {
                game.UpdateKey({ keyPressed: "ArrowUp" })
            }
            if (key === "ArrowDown") {
                game.UpdateKey({ keyPressed: "ArrowDown" })
            }
            if (key === "ArrowLeft") {
                game.UpdateKey({ keyPressed: "ArrowLeft" })
            }
            if (key === "ArrowRight") {
                game.UpdateKey({ keyPressed: "ArrowRight" })
            }
        }
        if (localPlayer != null) { playerId = localPlayer }
        socket.emit("myId", playerId)

        socket.on('connect', () => {
            console.log('Jogador conectado no servidor com o id:' + playerId)

            const KeybordListenes = createKeybordListenes(game)
            KeybordListenes.registerPlayerId(playerId)
            //KeybordListenes.subscribe(game.movePlayer)
            game.subscribe((command) => {
                socket.emit('move-player', command)
            })
            game.subscribe((command) => {
                socket.emit('on-death', command)
            })
        })

        socket.on('start', (command) => {
            game.start({ playerId: command.playerId, freq: command.freq })
        })
        socket.on('disconnect', (socket) => {
            game.removeplayer(playerId)
        })
        socket.on('setup', (state) => {
            if (!playerId) { playerId = socket.id }
            game.state = state

            renderScreen(screen, state, playerId, requestAnimationFrame)
        })

        socket.on('add-player', (command) => {
            game.addPlayer(command)
        })
        socket.on('remove-player', (command) => {
            game.removeplayer(command)
        })
        socket.on('add-fruit', (command) => {
            game.addFruit(command)
        })
        socket.on('remove-fruit', (command) => {
            game.removeFruit(command)
        })
        socket.on('recipe-death', (command) => {
            let cont = 0
            playersDeath.players[command.playerId] = ""

            if (command.playerId === playerId) {
                document.body.style.filter = "grayscale(100%)"
                setTimeout(() => {
                    document.body.style.filter = "none"
                }, 3000)
            }
            setInterval(() => {
                if (cont === 1) { delete playersDeath.players[command.playerId]; return } else {
                    cont += 1
                }
            }, 300)
        })
        socket.on('contagem', (info => {
            h1.textContent = info
        }))

        socket.on('render', (command) => { renderScreen(screen, state, playerId, requestAnimationFrame) })
    </script>
</body>

</html>
